<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ArimaaAnalyzer.Maui</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="ArimaaAnalyzer.Maui.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>


    <script>
        window.getBoardSquare = (x, y) => {
            const el = document.elementFromPoint(x, y);
            if (!el) return null;
            // Find the closest parent that is a square
            const square = el.closest('.square');
            if (square && square.dataset.row !== undefined && square.dataset.col !== undefined) {
                return [parseInt(square.dataset.row), parseInt(square.dataset.col)];
            }
            return null;
        };

        // Simple in-page drag state for palette/board interactions
        window._dragState = null;
        window.setDragFromPalette = (pieceChar) => {
            window._dragState = { source: 'palette', pieceChar: pieceChar };
        };
        window.setDragFromBoard = (row, col) => {
            window._dragState = { source: 'board', row: row, col: col };
        };
        window.getPalettePieceIfAny = () => {
            const s = window._dragState;
            if (s && s.source === 'palette' && s.pieceChar) return s.pieceChar;
            return '';
        };
        window.getBoardDragIfAny = () => {
            const s = window._dragState;
            if (s && s.source === 'board' && Number.isInteger(s.row) && Number.isInteger(s.col)) return [s.row, s.col];
            return null;
        };
        window.clearDragState = () => { window._dragState = null; };
        window.isOverElementById = (x, y, id) => {
            const el = document.elementFromPoint(x, y);
            if (!el) return false;
            const target = el.closest('#' + id);
            return !!target;
        };

        // Hotkeys: listener is always registered; Blazor sets window.arimaaHotkeys.ref via __arimaaHotkeysSetRef.
        window.arimaaHotkeys = { ref: null, bound: false };
        window.__arimaaHotkeysSetRef = function (r) {
            window.arimaaHotkeys = window.arimaaHotkeys || { ref: null, bound: false };
            window.arimaaHotkeys.ref = r;
        };
        (function () {
            const HOTKEY_KEYS = new Set(['j', 'l', 'i', 'k', 'g', 's']);
            function isEditableTarget(target) {
                if (!target) return false;
                const tag = target.tagName ? target.tagName.toLowerCase() : '';
                if (tag === 'input' || tag === 'textarea') return true;
                if (target.isContentEditable) return true;
                return !!target.closest('[contenteditable="true"]');
            }
            function handleKeyDown(e) {
                if (e.defaultPrevented || e.repeat) return;
                if (e.ctrlKey || e.altKey || e.metaKey) return;
                if (isEditableTarget(e.target)) return;
                const key = e.key;
                if (!key || key.length !== 1) return;
                const normalized = key.toLowerCase();
                if (!HOTKEY_KEYS.has(normalized)) return;
                if (!window.arimaaHotkeys || !window.arimaaHotkeys.ref) return;
                e.preventDefault();
                e.stopPropagation();
                try {
                    window.arimaaHotkeys.ref.invokeMethodAsync('OnKeyDown', normalized);
                } catch { /* host disconnected */ }
            }
            // Single capture listener on window (avoid double-fire from window+document).
            window.addEventListener('keydown', handleKeyDown, true);
            window.arimaaHotkeys.bound = true;
        })();
    </script>
</body>

</html>
